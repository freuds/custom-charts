{{- if and (hasKey .Values "serviceAccount") (or (not (hasKey .Values.serviceAccount "create")) .Values.serviceAccount.create) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if hasKey .Values.serviceAccount "name" }}
  name: {{ .Values.serviceAccount.name }}
  {{- else }}
  name: {{ .Release.Name }}
  {{- end }}
  labels:
    app: {{ .Release.Name }}
    cron: {{ .Release.Name }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
