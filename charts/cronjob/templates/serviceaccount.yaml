{{- $release_name := .Release.Name }}

{{- range $job := .Values.jobs }}
{{- if and (hasKey $job "serviceAccount") (or (not (hasKey $job.serviceAccount "create")) $job.serviceAccount.create) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- if hasKey $job.serviceAccount "name" }}
  name: {{ $job.serviceAccount.name }}
  {{- else }}
  name: {{ $job.name }}
  {{- end }}
  labels:
    app: {{ $release_name }}
    cron: {{ $job.name }}
  {{- with $job.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
