{{- if (.Values.rbac).clusterRole }}
{{- if .Values.rbac.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.clusterRole.name | default (printf "%s-cluster-role" .Release.Name) }}
  labels:
    app: {{ .Release.Name }}
rules:
{{ toYaml .Values.rbac.clusterRole.rules | indent 2 }}
{{- end }}
{{- end }}
---
{{- if (.Values.rbac).clusterRoleBinding }}
{{- if .Values.rbac.clusterRoleBinding.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.clusterRoleBinding.name | default (printf "%s-cluster-role-binding" .Release.Name) }}
  labels:
    app: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.clusterRole.name | default (printf "%s-cluster-role" .Release.Name) }}
subjects:
  - kind: ServiceAccount
    name: {{ (.Values.serviceAccount).name | default .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
