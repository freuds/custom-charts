# This is a YAML-formatted file.
#
# v2: one CronJob per chart install (no more `jobs:` list) -- each service
# already gets its own ArgoCD Application/values.yaml in GitOps setups, so a
# list of jobs inside a single release never added real flexibility. The
# resource name and default ServiceAccount/labels are derived from
# .Release.Name.
#
# Minimal live default below (harmless busybox noop) so `helm lint`/`helm
# template` always render a valid CronJob out of the box. Override every
# field below in your own values file.

image:
  repository: busybox
  tag: "1.36"
  imagePullPolicy: IfNotPresent

schedule: "0 0 * * *"

command: ["/bin/sh"]
args:
  - "-c"
  - "echo $(date) - noop"

# optional: IANA time zone for the schedule (requires Kubernetes >= 1.27)
# timeZone: "Europe/Paris"

# pause the cron without deleting it
# suspend: false

# give up a missed run after this many seconds (avoids catch-up bursts)
# startingDeadlineSeconds: 300

# concurrencyPolicy: Allow          # default: Allow
# failedJobsHistoryLimit: 1         # default: 1
# successfulJobsHistoryLimit: 3     # default: 3
# restartPolicy: OnFailure          # default: OnFailure

# retries before the Job is marked failed (Kubernetes default: 6)
# backoffLimit: 2

# kill a run that exceeds this duration (seconds)
# activeDeadlineSeconds: 3600

# auto-cleanup of finished Jobs/Pods (seconds)
# ttlSecondsAfterFinished: 86400

# pull from a private registry
# imagePullSecrets:
# - name: regcred

# priorityClassName: system-cluster-critical

# extra metadata on the pods (Prometheus scrape, Vault injector, ...)
# podAnnotations:
#   prometheus.io/scrape: "true"
# podLabels:
#   team: infra

# serviceAccount:
#   name: backup-sa
#   # set create: false to reference an existing ServiceAccount without creating it
#   create: true
#   annotations:
#     eks.amazonaws.com/role-arn: "arn:aws:iam::123456789:role/backup"

# optional RBAC, all disabled by default. clusterRole/clusterRoleBinding are
# cluster-scoped (e.g. a tool that must read resources across namespaces);
# role/roleBinding are namespaced to .Release.Namespace (e.g. a container
# that only needs to read pod logs in its own namespace). Both pairs bind to
# the same ServiceAccount (serviceAccount.name, or .Release.Name if unset)
# and can be enabled together.
# rbac:
#   clusterRole:
#     create: true
#     # name: my-app-cluster-role       # default: "<release-name>-cluster-role"
#     rules:
#       - apiGroups: [""]
#         resources: ["pods", "nodes"]
#         verbs: ["get", "list", "watch"]
#   clusterRoleBinding:
#     create: true
#     # name: my-app-cluster-role-binding
#   role:
#     create: true
#     # name: my-app-role                # default: "<release-name>-role"
#     rules:
#       - apiGroups: [""]
#         resources: ["pods", "pods/log"]
#         verbs: ["get", "list"]
#   roleBinding:
#     create: true
#     # name: my-app-role-binding

# pod-level security context
# securityContext:
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 2000

# container-level security context
# containerSecurityContext:
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: true
#   capabilities:
#     drop:
#     - ALL

# optional env vars
# env:
# - name: ECHO_VAR
#   value: "busybox"
# envFrom:
# - secretRef:
#     name: SECRET_DATA
# - configMapRef:
#     name: CONFIG_DATA

# resources:
#   limits:
#     cpu: 50m
#     memory: 256Mi
#   requests:
#     cpu: 50m
#     memory: 256Mi

# optional initContainers, raw Kubernetes container spec passthrough -- e.g.
# to prep a shared volume before the main container runs.
# initContainers:
#   - name: wait-for-something
#     image: busybox:1.36
#     command: ["sh", "-c", "sleep 5"]

# volumeMounts:
# - name: data
#   mountPath: /data
# volumes:
# - name: data
#   emptyDir: {}

# nodeSelector:
#   type: infra
# tolerations:
# - effect: NoSchedule
#   operator: Exists
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: kubernetes.io/e2e-az-name
#           operator: In
#           values:
#           - e2e-az1
#           - e2e-az2
