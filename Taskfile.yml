version: '3'

tasks:
  default:
    desc: "Display all available tasks for this project"
    silent: true
    cmds:
      - task --list-all

  generate:
    desc: Generate Helm charts
    silent: true
    cmds:
      - |
        for chart in charts/*/Chart.yaml; do
          chart_dir=$(dirname "$chart")
          helm dependency update "$chart_dir" || true
          helm package "$chart_dir" -d docs/
        done
      - task: prune-archives
      # Pas de --merge : prune-archives a déjà supprimé les anciens .tgz, donc
      # reconstruire l'index uniquement à partir de ce qui reste physiquement
      # dans docs/ évite d'accumuler des entrées fantômes (mêmes comportement
      # que le job "build" du workflow GitHub Actions, qui ne merge pas non plus).
      - helm repo index docs/ --url "https://freuds.github.io/custom-charts/"
      - task: generate-index-md

  prune-archives:
    desc: Ne garder que les 2 dernières versions de chaque archive .tgz dans docs/
    internal: true
    silent: true
    cmds:
      - |
        cd docs
        for chart in $(ls *.tgz 2>/dev/null | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*\.tgz$//' | sort -u); do
          files=$(ls "${chart}"-*.tgz 2>/dev/null | sort -V)
          count=$(echo "$files" | grep -c .)
          remove=$((count - 2))
          if [ "$remove" -gt 0 ]; then
            echo "$files" | head -n "$remove" | while read -r old; do
              echo "Suppression de $old"
              rm -f "$old"
            done
          fi
        done

  lint:
    desc: Lint Helm charts
    silent: true
    cmds:
      - ct lint --config charts/ct.yaml

  lint-all:
    desc: Lint et valide dynamiquement tous les charts listés dans chart-dirs de ct.yaml
    silent: true
    cmds:
      - task: lint
      - |
        for chart in $(yq '.chart-dirs[]' charts/ct.yaml); do
          helm lint charts/$chart
          helm template charts/$chart | \
            kubeconform -kubernetes-version 1.35.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip Certificate,Issuer
        done

  update-deps:
    desc: Update Helm dependencies
    silent: true
    cmds:
      - |
        for chart in $(yq '.chart-dirs[]' charts/ct.yaml); do
          helm dependency update charts/$chart
        done

  generate-index-md:
    desc: Generate index.md from index.yaml
    internal: true
    silent: true
    cmds:
      - |
        cat > docs/index.md << 'EOF'
        # custom-charts

        ## Charts disponibles

        EOF
      - |
        yq '.entries | keys[]' docs/index.yaml | while read chart; do
          version=$(yq ".entries.$chart[0].version" docs/index.yaml)
          description=$(yq ".entries.$chart[0].description" docs/index.yaml)
          appVersion=$(yq ".entries.$chart[0].appVersion" docs/index.yaml)
          echo "### $chart" >> docs/index.md
          echo "" >> docs/index.md
          echo "- **Description** : $description" >> docs/index.md
          echo "- **Version** : $version" >> docs/index.md
          echo "- **AppVersion** : $appVersion" >> docs/index.md
          echo "" >> docs/index.md
        done
      - |
        cat >> docs/index.md << 'EOF'
        ## Utilisation du repo Helm

        ```sh
        helm repo add custom-charts https://freuds.github.io/custom-charts
        ```
        EOF
