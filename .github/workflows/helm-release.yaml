name: Helm Charts Release

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-release.yaml'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'docs/**'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.1.4

      - name: Create docs directory if not exists
        run: mkdir -p docs

      - name: Package all charts
        run: |
          for chart in charts/*/Chart.yaml; do
            chart_dir=$(dirname "$chart")
            helm dependency update "$chart_dir" || true
            helm package "$chart_dir" -d docs/
          done

      - name: Generate Helm index.yaml
        run: |
          helm repo index docs/ --url "https://freuds.github.io/custom-charts/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: helm-charts
          path: docs/
          retention-days: 1

  deploy-pages:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: helm-charts
          path: docs/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

      # L'artefact "github-pages" tout juste uploadé n'est parfois pas encore
      # visible par l'API (« No artifacts named "github-pages" were found »).
      # On laisse d'abord le temps à l'API de le voir, puis on tolère un
      # premier échec, on attend et on retente une fois.
      - name: Wait for Pages artifact to be visible
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
